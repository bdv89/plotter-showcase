# Plotter — bloc à AJOUTER dans <NGINX_DIR>\conf\services.conf (calqué sur data_to_csv).
# upstreams.conf est AUTO-GÉNÉRÉ (dashboard) → on ne l'édite pas : proxy direct 127.0.0.1:9099.
# (Variante "convention" : enregistrer un upstream `plotter` via le dashboard puis
#  utiliser  proxy_pass http://plotter/api/;  à la place de l'adresse en dur.)

# Frontend buildé avec base=/plotter/ (alias direct sur le dist du projet)
location /plotter/ {
    alias <INSTALL_DIR>/260324/web/frontend/dist/;
    try_files $uri $uri/ /plotter/index.html;
}

# API → backend (le "/api/" final strippe "/plotter/api")
location /plotter/api/ {
    proxy_pass http://127.0.0.1:9099/api/;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    client_max_body_size 600m;            # uploads jusqu'à 500 Mo (override du 50m global)
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_request_buffering off;
}

# MCP (pilotage par une LLM) -> backend 9099. Bloc PLUS SPECIFIQUE que "/plotter/",
# donc nginx le choisit en premier (la plus longue correspondance de prefixe gagne).
#   claude mcp add --transport http plotter http://<serveur>/plotter/mcp
# Le transport streame : sans proxy_buffering off + HTTP/1.1, les reponses arrivent
# par blocs ou expirent. Pas d'authentification -> reserver au reseau de confiance.
location /plotter/mcp {
    proxy_pass http://127.0.0.1:9099/mcp;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header Connection        "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
}

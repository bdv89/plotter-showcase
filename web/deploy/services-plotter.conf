# Plotter — bloc à AJOUTER dans <NGINX_DIR>\conf\services.conf (calqué sur data_to_csv).
# upstreams.conf est AUTO-GÉNÉRÉ (dashboard) → on ne l'édite pas : proxy direct 127.0.0.1:9099.
# (Variante "convention" : enregistrer un upstream `plotter` via le dashboard puis
#  utiliser  proxy_pass http://plotter/api/;  à la place de l'adresse en dur.)

# Frontend buildé avec base=/plotter/ (alias direct sur le dist du projet)
location /plotter/ {
    alias <INSTALL_DIR>/260324/web/frontend/dist/;
    try_files $uri $uri/ /plotter/index.html;
}

# API → backend (le "/api/" final strippe "/plotter/api")
location /plotter/api/ {
    proxy_pass http://127.0.0.1:9099/api/;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    client_max_body_size 600m;            # uploads jusqu'à 500 Mo (override du 50m global)
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_request_buffering off;
}

# Plotter EXPÉRIMENTAL — bloc à AJOUTER dans <NGINX_DIR>\conf\services.conf (à côté du bloc /plotter/).
# Instance parallèle, indépendante de la prod : backend sur 127.0.0.1:9199 (service NSSM "CSVPlotter_Exp"),
# code dans la copie ...\260324-exp. Aucun impact sur /plotter/ (9099).
#
# ⚠️ Le frontend DOIT être buildé avec base=/plotter-exp/ et VITE_API_URL=/plotter-exp/api
#    (sinon assets 404 → page blanche). L'alias pointe sur le dist de la COPIE exp, pas la prod.

# Frontend exp buildé avec base=/plotter-exp/ (alias direct sur le dist de la copie expérimentale)
location /plotter-exp/ {
    alias <INSTALL_DIR>/260324-exp/web/frontend/dist/;
    try_files $uri $uri/ /plotter-exp/index.html;
}

# API exp → backend 9199 (le "/api/" final strippe "/plotter-exp/api")
location /plotter-exp/api/ {
    proxy_pass http://127.0.0.1:9199/api/;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    client_max_body_size 600m;            # uploads jusqu'à 500 Mo (override du 50m global)
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_request_buffering off;
}

# MCP (pilotage par une LLM) -> backend 9199. Bloc PLUS SPECIFIQUE que "/plotter-exp/",
# donc nginx le choisit en premier (la plus longue correspondance de prefixe gagne).
#   claude mcp add --transport http plotter-beta http://<serveur>/plotter-exp/mcp
# Le transport streame : sans proxy_buffering off + HTTP/1.1, les reponses arrivent
# par blocs ou expirent. Pas d'authentification -> reserver au reseau de confiance.
location /plotter-exp/mcp {
    proxy_pass http://127.0.0.1:9199/mcp;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header Connection        "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
}
